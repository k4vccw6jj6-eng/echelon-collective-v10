:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f4f0e8;background:#111417}*{box-sizing:border-box}body{margin:0;padding-bottom:calc(82px + env(safe-area-inset-bottom));}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:calc(20px + env(safe-area-inset-top)) 20px 16px;background:#171b1e;border-bottom:1px solid #333a3a}.eyebrow{font-size:10px;letter-spacing:3px;color:#b4a27d}.brand{font-family:Georgia,serif;font-size:28px;letter-spacing:1px;margin:5px 0}.sub{font-size:12px;color:#9ba5a3}main{max-width:720px;margin:auto;padding:18px 15px}.panel{background:#1b2023;border:1px solid #333a3c;border-radius:17px;padding:17px;margin-bottom:15px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#a5adab}.small{font-size:12px}.gold{color:#d7bd8a}h2{font-size:20px;font-family:Georgia,serif;font-weight:400;margin:0 0 14px}h3{font-size:16px;margin:8px 0 12px}.btn{background:#bda47c;color:#151719;border:0;border-radius:11px;padding:11px 15px;font-weight:650}.btn.secondary{background:#30383a;color:#f3eee4}.btn.danger{background:#573737;color:#fff}.iconbtn{background:#30383a;color:white;border:0;border-radius:9px;padding:8px 12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:11px;color:#bda47c;padding:9px 0}.day{min-height:64px;background:#252b2d;color:#f2efe8;border:1px solid transparent;border-radius:10px;text-align:left;padding:7px 5px;display:flex;flex-direction:column;gap:5px;overflow:hidden}.day.empty{background:transparent}.calname{font-size:9px;line-height:1.15;color:#e5d2ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}.day{min-height:76px}.day.today{border-color:#d4b47e}.day.selected{background:#554a35!important;outline:2px solid #d6b77c;outline-offset:-2px}.daynum{font-size:13px}.dotline{height:5px;border-radius:5px;min-width:10px}.item{width:100%;background:#252c2e;border:1px solid #3c4446;border-radius:12px;color:#f4f0e8;text-align:left;padding:13px;margin:6px 0}.item .name{font-size:15px;font-weight:600}.item .detail{font-size:12px;color:#adb6b3;margin-top:5px}.pill{background:#30383a;border-radius:100px;padding:5px 9px;font-size:11px}.field{margin:12px 0}label{display:block;font-size:12px;color:#c7c5bb;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;background:#292f31;color:#fff;border:1px solid #485052;border-radius:10px;outline:none}input:focus,select:focus{border-color:#c6ab80}.modalwrap{position:fixed;inset:0;z-index:20;background:#000b;display:flex;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:620px;max-height:92dvh;overflow:auto;background:#1c2224;border-radius:22px 22px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom));box-shadow:0 0 60px #0008}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1b2023;border-top:1px solid #3b4244;padding:9px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{flex:1;background:none;border:0;color:#9ba5a3;font-size:11px;padding:7px 0}.nav button.active{color:#d9bf90}.nav span{display:block;font-size:21px;margin-bottom:3px}.sep{height:1px;background:#394144;margin:16px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.totals{font-size:22px;font-family:Georgia,serif;color:#e0c28d}.tag{display:inline-block;border-radius:5px;padding:3px 6px;font-size:11px}.hint{font-size:12px;color:#b5bdb8;line-height:1.5}.emptymsg{text-align:center;padding:25px 10px;color:#a8b0ac}.scrollrow{display:flex;gap:8px;overflow:auto;padding:4px 0}.scrollrow button{white-space:nowrap}.check{float:right;color:#d4b781}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#d6ba8b;color:#16191a;padding:11px 20px;border-radius:10px;z-index:40;display:none}
</style></head><body><header><div class="eyebrow">PRIVATE OPERATIONS</div><div class="brand">ECHELON <span class="gold">COLLECTIVE</span></div><div class="sub">Scheduling · Billing · Payroll</div></header><main id="app"></main><nav class="nav" id="nav"></nav><div id="overlay"></div><div id="toast"></div><script>
const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const KEY='echelon_collective_v10';const fresh=()=>({clients:[],employees:[],shifts:[],agreed:[],agreedShifts:[],invoiceSeq:1001});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){db=fresh()}for(const k of Object.keys(fresh()))if(db[k]===undefined)db[k]=fresh()[k];let employeeMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);let page='calendar',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),chosen=localDate(new Date()),modal=null,shiftId=null,employeeId=null;const $=id=>document.getElementById(id),id=()=>Math.random().toString(36).slice(2,11),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+(+n||0).toFixed(2),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'}),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage unavailable. Export a backup now.')}},toast=t=>{let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)},client=id=>db.clients.find(x=>x.id===id),emp=id=>db.employees.find(x=>x.id===id),shift=id=>db.shifts.find(x=>x.id===id),shiftTotal=s=>s.people.reduce((n,p)=>n+(+p.hours||0)*(+p.billRate||0),+s.fee||0),shiftPay=s=>s.people.reduce((n,p)=>n+(+p.hours||0)*(+p.wage||0),0);function btn(t,fn,cl='secondary'){return `<button class="btn ${cl}" onclick="${fn}">${t}</button>`}function render(){const navs=[['calendar','▦','Calendar'],['agreed','✓','Agreed'],['clients','♧','Clients'],['employees','♟','Employees'],['billing','▤','Billing']];$('nav').innerHTML=navs.map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${n}</button>`).join('');$('app').innerHTML=({calendar:calendarView,agreed:agreedView,clients:clientsView,employees:employeesView,billing:billingView})[page]();renderModal()};function go(p){page=p;modal=null;render()}function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function calendarView(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=count;d++){let date=localDate(new Date(y,m,d)),ss=db.shifts.filter(s=>s.date===date),dots=ss.slice(0,3).map(s=>`<div class="dotline" style="background:${client(s.clientId)?.color||'#bda47c'}"></div>`).join(''),names=[...new Set(db.agreedShifts.filter(a=>a.date===date).map(a=>a.employeeId))].map(eid=>emp(eid)?.name).filter(Boolean);cells+=`<button class="day ${date===localDate(new Date())?'today':''} ${date===chosen?'selected':''}" onclick="openDate('${date}')"><span class="daynum">${d}</span>${dots}${names.slice(0,3).map(n=>`<span class="calname">${esc(n)}</span>`).join('')}${names.length>3?`<span class="calname">+${names.length-3} more</span>`:''}</button>`}return `<div class="panel"><div class="flex"><button class="iconbtn" onclick="changeMonth(-1)">‹</button><h2 style="margin:0">${month.toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</h2><button class="iconbtn" onclick="changeMonth(1)">›</button></div><p class="hint">Tap any date to open its shifts or schedule a new one.</p><div class="calendar">${cells}</div></div><div class="panel"><h2>Upcoming shifts</h2>${db.shifts.filter(s=>s.date>=localDate(new Date())).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,7).map(s=>`<button class="item" onclick="openShift('${s.id}')"><div class="name"><span style="color:${client(s.clientId)?.color||'#d3bb8d'}">●</span> ${esc(client(s.clientId)?.name||'Client removed')}</div><div class="detail">${fmt(s.date)} · ${s.people.length} employees</div></button>`).join('')||'<div class="emptymsg">Tap a calendar date to schedule your first shift.</div>'}</div>`}function openDate(date){chosen=date;let ss=db.shifts.filter(s=>s.date===date);if(ss.length===0){if(db.clients.length)newShift(date);else{modal={type:'date',date};render()}}else{modal={type:'date',date};render()}}function newShift(date=chosen){if(!db.clients.length){modal={type:'noClients'};render();return}let s={id:id(),date,clientId:db.clients[0].id,fee:0,notes:'',people:[],invoiceNo:null};db.shifts.push(s);save();openShift(s.id)}function openShift(sid){shiftId=sid;modal={type:'shift'};render()}function addPerson(eid){let s=shift(shiftId);if(!s.people.some(p=>p.id===eid)){let e=emp(eid);s.people.push({id:eid,hours:0,wage:+e.wage||0,billRate:+e.billRate||0});save()}render()}function removePerson(eid){let s=shift(shiftId);s.people=s.people.filter(p=>p.id!==eid);save();modal={type:'shift'};render()}function personDetails(eid){employeeId=eid;modal={type:'person'};render()}function updatePerson(){let s=shift(shiftId),p=s.people.find(p=>p.id===employeeId);p.hours=Math.max(0,+$('pHours').value||0);p.wage=Math.max(0,+$('pWage').value||0);p.billRate=Math.max(0,+$('pRate').value||0);save();modal={type:'shift'};render();toast('Employee details saved')}function updateShift(){let s=shift(shiftId);s.clientId=$('sClient').value;s.fee=Math.max(0,+$('sFee').value||0);s.notes=$('sNotes').value;save();toast('Shift saved');render()}function deleteShift(){if(!confirm('Delete this shift?'))return;db.shifts=db.shifts.filter(s=>s.id!==shiftId);save();modal={type:'date',date:chosen};render()}function agreedView(){return `<div class="panel"><h2>Agreed Employees</h2><p class="hint">Tap employees to add or remove them from your agreed list. These names will be available when scheduling shifts.</p>${db.employees.map(e=>`<button class="item" onclick="toggleAgreed('${e.id}')"><span class="name">${esc(e.name)}</span><span class="check">${db.agreed.includes(e.id)?'✓ Agreed':'＋ Add'}</span></button>`).join('')||'<div class="emptymsg">Add employees first.</div>'}${btn('Manage employees',"go('employees')")}</div>`}function toggleAgreed(eid){db.agreed=db.agreed.includes(eid)?db.agreed.filter(x=>x!==eid):[...db.agreed,eid];save();render()}function clientsView(){return `<div class="panel"><div class="flex"><h2>Clients</h2>${btn('+ New client',"editClient()",'')}</div>${db.clients.map(c=>`<button class="item" onclick="editClient('${c.id}')"><div class="name"><span style="color:${c.color}">●</span> ${esc(c.name)}</div><div class="detail">${esc(c.address||'Tap to edit client details')}</div></button>`).join('')||'<div class="emptymsg">Add a client to start scheduling.</div>'}</div>`}function employeesView(){return `<div class="panel"><div class="flex"><h2>Employees</h2>${btn('+ New employee',"editEmployee()",'')}</div>${db.employees.map(e=>`<button class="item" onclick="openEmployeeCalendar('${e.id}')"><div class="name">${esc(e.name)}</div><div class="detail">${db.agreedShifts.filter(a=>a.employeeId===e.id).length} agreed shifts · Tap for calendar</div></button>`).join('')||'<div class="emptymsg">Add employees, then mark them Agreed.</div>'}</div>`}function editClient(cid){modal={type:'client',id:cid||null};render()}function saveClient(){let cid=modal.id,c=cid?client(cid):{id:id()};c.name=$('cName').value.trim();if(!c.name)return alert('Enter client name');c.address=$('cAddress').value.trim();c.email=$('cEmail').value.trim();c.color=$('cColor').value;if(!cid)db.clients.push(c);save();modal=null;go('clients')}function deleteClient(cid){if(db.shifts.some(s=>s.clientId===cid))return alert('This client is used in shifts. Remove those shifts first.');if(!confirm('Delete client?'))return;db.clients=db.clients.filter(c=>c.id!==cid);save();modal=null;render()}let selectedEmployeeDates=[];function openEmployeeCalendar(eid){if(employeeId!==eid)selectedEmployeeDates=[];employeeId=eid;employeeMonth=new Date(month.getFullYear(),month.getMonth(),1);modal={type:'employeeCalendar'};render()}function employeeChangeMonth(n){employeeMonth=new Date(employeeMonth.getFullYear(),employeeMonth.getMonth()+n,1);render()}function openEmployeeDate(date){modal={type:'employeeDate',date};render()}function toggleEmployeeDate(date){selectedEmployeeDates=selectedEmployeeDates.includes(date)?selectedEmployeeDates.filter(d=>d!==date):[...selectedEmployeeDates,date];render()}function clearEmployeeDates(){selectedEmployeeDates=[];render()}function saveMultipleAgreements(){let clientId=$('multiAgreementClient').value,added=0;for(let date of selectedEmployeeDates){if(!db.agreedShifts.some(a=>a.employeeId===employeeId&&a.date===date&&a.clientId===clientId)){db.agreedShifts.push({id:id(),employeeId,date,clientId});added++}}save();selectedEmployeeDates=[];render();toast(added+' agreed shift'+(added===1?'':'s')+' saved')}function addEmployeeAgreement(){let date=modal.date,clientId=$('agreementClient').value;if(!db.agreedShifts.some(a=>a.employeeId===employeeId&&a.date===date&&a.clientId===clientId)){db.agreedShifts.push({id:id(),employeeId,date,clientId});save()}modal={type:'employeeDate',date};render();toast('Agreed shift saved')}function removeEmployeeAgreement(aid){db.agreedShifts=db.agreedShifts.filter(a=>a.id!==aid);save();render()}function employeeCalendarMarkup(){let y=employeeMonth.getFullYear(),m=employeeMonth.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=count;d++){let date=localDate(new Date(y,m,d)),aa=db.agreedShifts.filter(a=>a.date===date&&a.employeeId===employeeId);cells+=`<button class="day ${selectedEmployeeDates.includes(date)?'selected':''}" onclick="toggleEmployeeDate('${date}')"><span class="daynum">${d}</span>${aa.map(a=>`<span class="calname">${esc(client(a.clientId)?.name||'Agreed')}</span>`).join('')}</button>`}return `<div class="flex"><button class="iconbtn" onclick="employeeChangeMonth(-1)">‹</button><h3>${employeeMonth.toLocaleDateString('en-CA',{month:'long',year:'numeric'})}</h3><button class="iconbtn" onclick="employeeChangeMonth(1)">›</button></div><p class="hint">Tap multiple dates to select them in gold, then save all at once. Existing agreed shifts are shown on the dates.</p><div class="calendar">${cells}</div><div class="sep"></div><p class="hint">${selectedEmployeeDates.length} date(s) selected</p><div class="field"><label>Client for selected dates</label><select id="multiAgreementClient"><option value="">Client not assigned yet</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="flex">${btn('Add agreed shifts to selected dates','saveMultipleAgreements()','')}${btn('Clear selection','clearEmployeeDates()','')}</div>`}function agreementNames(date){let aa=db.agreedShifts.filter(a=>a.date===date);return [...new Set(aa.map(a=>a.employeeId))].map(eid=>({eid,name:emp(eid)?.name})).filter(x=>x.name)}function editEmployee(eid){modal={type:'employee',id:eid||null};render()}function saveEmployee(){let eid=modal.id,e=eid?emp(eid):{id:id()};e.name=$('eName').value.trim();if(!e.name)return alert('Enter employee name');e.wage=Math.max(0,+$('eWage').value||0);e.billRate=Math.max(0,+$('eRate').value||0);e.phone=$('ePhone').value.trim();if(!eid)db.employees.push(e);save();modal=null;go('employees')}function deleteEmployee(eid){if(db.shifts.some(s=>s.people.some(p=>p.id===eid)))return alert('This employee is assigned to shifts. Remove them from those shifts first.');if(!confirm('Delete employee?'))return;db.employees=db.employees.filter(e=>e.id!==eid);db.agreed=db.agreed.filter(x=>x!==eid);db.agreedShifts=db.agreedShifts.filter(a=>a.employeeId!==eid);save();modal=null;render()}function billingView(){let shifts=[...db.shifts].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="panel"><h2>Billing & Payroll</h2><div class="two"><div><div class="small muted">Total billable</div><div class="totals">${money(shifts.reduce((n,s)=>n+shiftTotal(s),0))}</div></div><div><div class="small muted">Employee wages</div><div class="totals">${money(shifts.reduce((n,s)=>n+shiftPay(s),0))}</div></div></div><div class="sep"></div><p class="hint">Select a shift to view its employee-by-employee invoice and payroll totals.</p>${shifts.map(s=>`<button class="item" onclick="invoice('${s.id}')"><div class="name">${esc(client(s.clientId)?.name||'Unknown client')} · ${money(shiftTotal(s))}</div><div class="detail">${fmt(s.date)} · ${s.people.length} employees</div></button>`).join('')||'<div class="emptymsg">No shifts to bill yet.</div>'}</div><div class="panel"><h2>Data & backups</h2><p class="hint">Your information is saved on this device in this app. Export backups regularly: clearing website/app data can erase local records.</p>${btn('Export backup',"exportBackup()") } ${btn('Import backup',"$('backupFile').click()") }<input type="file" id="backupFile" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></div>`}function invoice(sid){shiftId=sid;modal={type:'invoice'};render()}function printInvoice(){let s=shift(shiftId),c=client(s.clientId),rows=s.people.map(p=>`<tr><td>${esc(emp(p.id)?.name||'Employee')}</td><td>${p.hours}</td><td>${money(p.billRate)}</td><td>${money(p.hours*p.billRate)}</td></tr>`).join('');let html=`<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Invoice</title><style>body{font-family:Arial;padding:30px;color:#222}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ccc;text-align:left}h1{letter-spacing:2px}</style></head><body><h1>ECHELON COLLECTIVE</h1><h2>Invoice ${s.invoiceNo||'Draft'}</h2><p><b>Client:</b> ${esc(c?.name||'')}<br>${esc(c?.address||'')}<br><b>Shift:</b> ${fmt(s.date)}</p><table><tr><th>Employee</th><th>Hours</th><th>Billing rate</th><th>Amount</th></tr>${rows}<tr><td colspan="3">Booking fee</td><td>${money(s.fee)}</td></tr><tr><th colspan="3">Total</th><th>${money(shiftTotal(s))}</th></tr></table><p>${esc(s.notes)}</p><script>window.print()<\/script></body></html>`;let w=window.open('','_blank');if(w){w.document.write(html);w.document.close()}else alert('Allow pop-ups to print the invoice.')}function numberInvoice(){let s=shift(shiftId);if(!s.invoiceNo){s.invoiceNo=db.invoiceSeq++;save()}render()}function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Echelon-Collective-backup-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data.clients)||!Array.isArray(data.employees)||!Array.isArray(data.shifts))throw Error();if(!confirm('Replace all current app data with this backup?'))return;db={...fresh(),...data};save();render();toast('Backup restored')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}function closeModal(){modal=null;render()}function renderModal(){let o=$('overlay');if(!modal){o.innerHTML='';return}let m=modal,content='',title='',back='closeModal()';if(m.type==='noClients'){title='Add a client first';content=`<p class="hint">A shift needs a client. Create one now, then tap the date again.</p>${btn('Create client',"editClient()",'')}`}if(m.type==='date'){title=fmt(m.date);content=`<p class="hint">Tap a shift to edit it, or create another shift on this date.</p>${db.shifts.filter(s=>s.date===m.date).map(s=>`<button class="item" onclick="openShift('${s.id}')"><div class="name"><span style="color:${client(s.clientId)?.color||'#d9bf90'}">●</span> ${esc(client(s.clientId)?.name||'Unknown client')}</div><div class="detail">${s.people.length} employees · ${money(shiftTotal(s))}</div></button>`).join('')}<div class="sep"></div><h3>Agreed employees</h3>${agreementNames(m.date).map(a=>`<div class="item"><span class="name">${esc(a.name)}</span></div>`).join('')||'<p class="hint">No agreed employees for this date.</p>'}${btn('+ Another shift',`newShift('${m.date}')`,'')}`}if(m.type==='shift'){let s=shift(shiftId);title=fmt(s.date);content=`<div class="field"><label>Client</label><select id="sClient" onchange="updateShift()">${db.clients.map(c=>`<option value="${c.id}" ${c.id===s.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="flex"><h3>Shift employees</h3><span class="pill">${s.people.length} selected</span></div><p class="hint">Only names appear here. Tap a name to open hours, wages and billing.</p>${s.people.map(p=>`<button class="item" onclick="personDetails('${p.id}')"><span class="name">${esc(emp(p.id)?.name||'Employee removed')}</span><span class="check">›</span></button>`).join('')||'<div class="emptymsg">Tap names below to add employees.</div>'}<div class="sep"></div><h3>Agreed Employees</h3>${[...new Set([...agreementNames(s.date).map(a=>a.eid),...db.agreed])].filter(eid=>!!emp(eid)).map(eid=>`<button class="item" onclick="${s.people.some(p=>p.id===eid)?`removePerson('${eid}')`:`addPerson('${eid}')`}"><span class="name">${esc(emp(eid).name)}</span><span class="check">${s.people.some(p=>p.id===eid)?'✓ Added · remove':'＋ Add'}</span></button>`).join('')||'<p class="hint">No agreed employees yet. Use the Agreed tab to select employees.</p>'}<div class="sep"></div><div class="field"><label>Fixed booking fee ($)</label><input id="sFee" type="number" min="0" step="0.01" value="${s.fee}" onchange="updateShift()"></div><div class="field"><label>Shift notes (optional)</label><textarea id="sNotes" rows="2" onchange="updateShift()">${esc(s.notes)}</textarea></div><div class="flex"><span class="muted">Invoice total</span><strong class="totals">${money(shiftTotal(s))}</strong></div><div class="sep"></div><div class="flex">${btn('View billing',`invoice('${s.id}')`)}${btn('Delete shift','deleteShift()','danger')}</div>`;back=`openDate('${s.date}')`}if(m.type==='person'){let s=shift(shiftId),p=s.people.find(p=>p.id===employeeId);title=emp(p.id)?.name||'Employee';back=`openShift('${s.id}')`;content=`<p class="hint">Enter the details for this employee on this shift. These fields stay hidden on the shift employee list.</p><div class="field"><label>Hours worked</label><input id="pHours" type="number" min="0" step="0.25" inputmode="decimal" value="${p.hours}"></div><div class="field"><label>Employee hourly wage ($)</label><input id="pWage" type="number" min="0" step="0.01" inputmode="decimal" value="${p.wage}"></div><div class="field"><label>Client billing rate per hour ($)</label><input id="pRate" type="number" min="0" step="0.01" inputmode="decimal" value="${p.billRate}"></div>${btn('Save employee details','updatePerson()','')}`;}if(m.type==='employeeCalendar'){title=emp(employeeId)?.name||'Employee calendar';content=employeeCalendarMarkup()+`<div class="sep"></div>${btn('Edit employee details',`editEmployee('${employeeId}')`)}`;back="go('employees')"}if(m.type==='employeeDate'){title=fmt(m.date);back='openEmployeeCalendar(employeeId)';let aa=db.agreedShifts.filter(a=>a.employeeId===employeeId&&a.date===m.date);content=`<h3>Agreed shifts</h3>${aa.map(a=>`<div class="item flex"><span class="name">${esc(client(a.clientId)?.name||'Unassigned client')}</span><button class="iconbtn" onclick="removeEmployeeAgreement('${a.id}')">Remove</button></div>`).join('')||'<p class="hint">No agreed shifts on this date.</p>'}<div class="sep"></div><div class="field"><label>Client</label><select id="agreementClient"><option value="">Client not assigned yet</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${btn('+ Add agreed shift','addEmployeeAgreement()','')}`;}if(m.type==='client'){let c=client(m.id)||{name:'',address:'',email:'',color:'#bda47c'};title=m.id?'Edit client':'New client';content=`<div class="field"><label>Client name</label><input id="cName" value="${esc(c.name)}"></div><div class="field"><label>Billing address</label><textarea id="cAddress" rows="3">${esc(c.address)}</textarea></div><div class="field"><label>Email</label><input id="cEmail" type="email" value="${esc(c.email)}"></div><div class="field"><label>Calendar colour</label><input id="cColor" type="color" value="${c.color}" style="height:52px"></div><div class="flex">${btn('Save client','saveClient()','')}${m.id?btn('Delete',`deleteClient('${m.id}')`,'danger'):''}</div>`}if(m.type==='employee'){let e=emp(m.id)||{name:'',wage:0,billRate:0,phone:''};title=m.id?'Edit employee':'New employee';content=`<div class="field"><label>Employee name</label><input id="eName" value="${esc(e.name)}"></div><div class="field"><label>Default hourly wage ($)</label><input id="eWage" type="number" min="0" step="0.01" value="${e.wage}"></div><div class="field"><label>Default client billing rate ($/hour)</label><input id="eRate" type="number" min="0" step="0.01" value="${e.billRate}"></div><div class="field"><label>Phone (optional)</label><input id="ePhone" value="${esc(e.phone)}"></div><div class="flex">${btn('Save employee','saveEmployee()','')}${m.id?btn('Delete',`deleteEmployee('${m.id}')`,'danger'):''}</div>`}if(m.type==='invoice'){let s=shift(shiftId),c=client(s.clientId);title='Shift billing';back=`openShift('${s.id}')`;content=`<div class="small muted">${fmt(s.date)}</div><h3>${esc(c?.name||'Unknown client')}</h3><p class="hint">${esc(c?.address||'No billing address entered')}</p><div class="sep"></div>${s.people.map(p=>`<div class="item" style="cursor:default"><div class="flex"><strong>${esc(emp(p.id)?.name||'Employee')}</strong><strong>${money(p.hours*p.billRate)}</strong></div><div class="detail">${p.hours} hrs × ${money(p.billRate)} billing rate</div><div class="detail">Payroll: ${p.hours} hrs × ${money(p.wage)} = ${money(p.hours*p.wage)}</div></div>`).join('')}<div class="flex" style="margin-top:15px"><span>Booking fee</span><strong>${money(s.fee)}</strong></div><div class="sep"></div><div class="flex"><span>Invoice total</span><strong class="totals">${money(shiftTotal(s))}</strong></div><div class="flex" style="margin-top:12px"><span>Employee payroll total</span><strong>${money(shiftPay(s))}</strong></div><div class="sep"></div><p class="small muted">Invoice #${s.invoiceNo||'Not assigned'}</p><div class="flex" style="flex-wrap:wrap">${btn('Assign invoice number','numberInvoice()')}${btn('Print / Save PDF','printInvoice()','')}</div>`}o.innerHTML=`<div class="modalwrap" role="dialog" aria-modal="true"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" onclick="${back}" aria-label="Back">✕</button></div>${content}</div></div>`}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
