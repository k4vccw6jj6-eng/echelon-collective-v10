db.clients.push(c);save();modal=null;go('clients')}function deleteClient(cid){if(db.shifts.some(s=>s.clientId===cid))return alert('This client is used in shifts. Remove those shifts first.');if(!confirm('Delete client?'))return;db.clients=db.clients.filter(c=>c.id!==cid);save();modal=null;render()}let selectedEmployeeDates=[];function openEmployeeCalendar(eid){if(employeeId!==eid)selectedEmployeeDates=[];employeeId=eid;employeeMonth=new Date(month.getFullYear(),month.getMonth(),1);modal={type:'employeeCalendar'};render()}function employeeChangeMonth(n){employeeMonth=new Date(employeeMonth.getFullYear(),employeeMonth.getMonth()+n,1);render()}function openEmployeeDate(date){modal={type:'employeeDate',date};render()}function toggleEmployeeDate(date){selectedEmployeeDates=selectedEmployeeDates.includes(date)?selectedEmployeeDates.filter(d=>d!==date):[...selectedEmployeeDates,date];render()}function clearEmployeeDates(){selectedEmployeeDates=[];render()}function saveMultipleAgreements(){let clientId=$('multiAgreementClient').value,added=0;for(let date of selectedEmployeeDates){if(!db.agreedShifts.some(a=>a.employeeId===employeeId&&a.date===date&&a.clientId===clientId)){db.agreedShifts.push({id:id(),employeeId,date,clientId});added++}}save();selectedEmployeeDates=[];render();toast(added+' agreed shift'+(added===1?'':'s')+' saved')}function addEmployeeAgreement(){let date=modal.date,clientId=$('agreementClient').value;if(!db.agreedShifts.some(a=>a.employeeId===employeeId&&a.date===date&&a.clientId===clientId)){db.agreedShifts.push({id:id(),employeeId,date,clientId});save()}modal={type:'employeeDate',date};render();toast('Agreed shift saved')}function removeEmployeeAgreement(aid){db.agreedShifts=db.agreedShifts.filter(a=>a.id!==aid);save();render()}function employeeCalendarMarkup(){let y=employeeMonth.getFullYear(),m=employeeMonth.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();let cells=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div cl function pdfFromInvoice(html){

 pages.push(ops.join('\n'));
 const objects=[],add=o=>(objects.push(o),objects.length);
 const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'),f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
 const kids=[],pageObjects=[];

function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Echelon-Cutcraft-backup-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data.clients)||!Array.isArray(data.employees)||!Array.isArray(data.shifts))throw Error();if(!confirm('Replace all current app data with this backup?'))return;db={...fresh(),...data};if(!Array.isArray(db.combinedInvoices))db.combinedInvoices=[];save();render();toast('Backup restored')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}function closeModal(){modal=null;render()}function renderModal(){let o=$('overlay');if(!modal){o.innerHTML='';return}let m=modal,content='',title='',back='closeModal()';if(m.type==='noClients'){title='Add a client first';content=`<p class="hint">A shift needs a client. Create one now, then tap the date again.</p>${btn('Create client',"editClient()",'')}`}if(m.type==='date'){title=fmt(m.date);content=`<p class="hint">Tap a shift to edit it, or create another shift on this date.</p>${db.shifts.filter(s=>s.date===m.date).map(s=>`<button class="item" onclick="openShift('${s.id}')"><div class="name"><span style="color:${client(s.clientId)?.color||'#d9bf90'}">●</span> ${esc(client(s.clientId)?.name||'Unknown client')}</div><div class="detail">${s.people.length} employees · ${money(shiftTotal(s))}</div></button>`).join('')}<div class="sep"></div><h3>Agreed employees</h3>${agreementNames(m.date).map(a=>`<div class="item"><span class="name">${esc(a.name)}</span></div>`).join('')||'<p class="hint">No agreed employees for this date.</p>'}${btn('+ Another shift',`newShift('${m.date}')`,'')}`}if(m.type==='shift'){let s=shift(shiftId);title=fmt(s.date);content=`<div class="field"><label>Client</label><select id="sClient" onchange="updateShift()">${db.clients.map(c=>`<option value="${c.id}" ${c.id===s.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="flex"><h3>Shift employees</h3><span class="pill">${s.people.length} selected</span></div><div class="field"><label>Hours for the entire crew</label><div class="flex" style="gap:8px"><input id="crewHours" type="number" min="0" step="0.25" inputmode="decimal" placeholder="e.g. 8" style="flex:1;min-width:0">${btn('Apply to all','applyCrewHours()','')}</div><p class="hint">Sets everyone’s hours. Tap any employee below to adjust their hours individually.</p></div><p class="hint">Hours and wages are shown below each employee. Tap a name to edit their shift details.</p>${s.people.map(p=>`<button class="item" onclick="personDetails('${p.id}')"><span><span class="name">${esc(emp(p.id)?.name||'Employee removed')}</span><span class="detail" style="display:block;margin-top:5px">${Number(p.hours||0)} hours · ${money(Number(p.wage||0))}/hr</span></span><span class="check">›</span></button>`).join('')||'<div class="emptymsg">Tap names below to add employees.</div>'}<div class="sep"></div><h3>Agreed Employees</h3>${[...new Set([...agreementNames(s.date).map(a=>a.eid),...db.agreed])].filter(eid=>!!emp(eid)).map(eid=>`<button class="item" onclick="${s.people.some(p=>p.id===eid)?`removePerson('${eid}')`:`addPerson('${eid}')`}"><span class="name">${esc(emp(eid).name)}</span><span class="check">${s.people.some(p=>p.id===eid)?'✓ Added · remove':'＋ Add'}</span></button>`).join('')||'<p class="hint">No agreed employees yet. Use the Agreed tab to select employees.</p>'}<div class="sep"></div><div class="item" style="cursor:default"><div class="flex"><span>Booking fee · $5 per employee</span><strong>${money(s.people.length*5)}</strong></div></div><div class="field"><label>Shift notes (optional)</label><textarea id="sNotes" rows="2" onchange="updateShift()">${esc(s.notes)}</textarea></div><div class="flex"><span class="muted">Invoice total</span><strong class="totals">${money(shiftTotal(s))}</strong></div><div class="sep"></div><div class="flex">${btn('View billing',`invoice('${s.id}')`)}${btn('Delete shift','deleteShift()','danger')}</div>`;back=`openDate('${s.date}')`}if(m.type==='person'){let s=shift(shiftId),p=s.people.find(p=>p.id===employeeId);title=emp(p.id)?.name||'Employee';back=`openShift('${s.id}')`;content=`<p class="hint">Enter the details for this employee on this shift. These fields stay hidden on the shift employee list.</p><div class="field"><label>Hours worked</label><input id="pHours" type="number" min="0" step="0.25" inputmode="decimal" value="${p.hours}"></div><div class="field"><label>Employee hourly wage ($)</label><input id="pWage" type="number" min="0" step="0.01" inputmode="decimal" value="${p.wage}"></div>${btn('Save employee details','updatePerson()','')}`;}if(m.type==='employeeCalendar'){title=emp(employeeId)?.name||'Employee calendar';content=employeeCalendarMarkup()+`<div class="sep"></div>${btn('Edit employee details',`editEmployee('${employeeId}')`)}`;back="go('employees')"}if(m.type==='employeeDate'){title=fmt(m.date);back='openEmployeeCalendar(employeeId)';let aa=db.agreedShifts.filter(a=>a.employeeId===employeeId&&a.date===m.date);content=`<h3>Agreed shifts</h3>${aa.map(a=>`<div class="item flex"><span class="name">${esc(client(a.clientId)?.name||'Unassigned client')}</span><button class="iconbtn" onclick="removeEmployeeAgreement('${a.id}')">Remove</button></div>`).join('')||'<p class="hint">No agreed shifts on this date.</p>'}<div class="sep"></div><div class="field"><label>Client</label><select id="agreementClient"><option value="">Client not assigned yet</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${btn('+ Add agreed shift','addEmployeeAgreement()','')}`;}if(m.type==='client'){let c=client(m.id)||{name:'',address:'',email:'',color:'#bda47c'};title=m.id?'Edit client':'New client';content=`<div class="field"><label>Client name</label><input id="cName" value="${esc(c.name)}"></div><div class="field"><label>Billing address</label><textarea id="cAddress" rows="3">${esc(c.address)}</textarea></div><div class="field"><label>Email</label><input id="cEmail" type="email" value="${esc(c.email)}"></div><div class="field"><label>Calendar colour</label><input id="cColor" type="color" value="${c.color}" style="height:52px"></div><div class="flex">${btn('Save client','saveClient()','')}${m.id?btn('Delete',`deleteClient('${m.id}')`,'danger'):''}</div>`}if(m.type==='employee'){let e=emp(m.id)||{name:'',wage:0,billRate:0,phone:''};title=m.id?'Edit employee':'New employee';content=`<div class="field"><label>Employee name</label><input id="eName" value="${esc(e.name)}"></div><div class="field"><label>Default hourly wage ($)</label><input id="eWage" type="number" min="0" step="0.01" value="${e.wage}"></div><div class="field"><label>Phone (optional)</label><input id="ePhone" value="${esc(e.phone)}"></div><div class="flex">${btn('Save employee','saveEmployee()','')}${m.id?btn('Delete',`deleteEmployee('${m.id}')`,'danger'):''}</div>`}if(m.type==='combinedInvoice'){let d=combinedData(),c=client(billClient);title='Combined client invoice';back="go('billing')";content=`<div class="small muted">${d.shifts.length} selected workdays · Dates combined into one bill</div><div class="field"><label>Invoice date (editable, defaults to last day worked)</label><input id="combinedDate" type="date" value="${lastWorkDate(d.shifts)}"></div><h3>${esc(c?.name||'Client')}</h3><p class="hint">${esc(c?.address||'')}</p><div class="sep"></div>${invoiceWorkdayPreview(d.entries)}<div style="display:none">${d.entries.map(p=>`<div class="item" style="cursor:default"><div class="flex"><strong>${esc(emp(p.id)?.name||'Employee')}</strong><strong>${money(p.amount)}</strong></div><div class="detail">${Number(p.hours.toFixed(2))} total hours · ${p.rates.every(r=>r===p.rates[0])?money(p.rates[0])+'/hr':'Variable hourly rates'}</div></div>`).join('')||'<p class="hint">No employees assigned to these dates.</p>'}</div><div class="flex" style="margin-top:15px"><span>Booking fees (${d.shifts.reduce((n,s)=>n+s.people.length,0)} assignments × $5)</span><strong>${money(d.fee)}</strong></div><div class="sep"></div><div class="flex"><span>Invoice total</span><strong class="totals">${money(d.total)}</strong></div><div class="flex" style="margin-top:12px"><span>Employee payroll total</span><strong>${money(d.total-d.fee)}</strong></div><div class="sep"></div><p class="small muted">Invoice #${currentCombinedNumber()||'Not assigned'}</p><div class="flex" style="flex-wrap:wrap">${btn('Assign invoice number','combinedInvoiceNumber()')}${btn('Share Invoice','printCombinedInvoice()','')}${btn('Save invoice','saveCurrentCombinedInvoice()','')}</div>`;}if(m.type==='invoice'){let s=shift(shiftId),c=client(s.clientId);title='Shift billing';back=`openShift('${s.id}')`;content=`<div class="small muted">${fmt(s.date)}</div><div class="field"><label>Invoice date</label><input id="singleDate" type="date" value="${s.invoiceDate||s.date}" onchange="shift('${s.id}').invoiceDate=this.value;save()"></div><h3>${esc(c?.name||'Unknown client')}</h3><p class="hint">${esc(c?.address||'No billing address entered')}</p><div class="sep"></div>${s.people.map(p=>`<div class="item" style="cursor:default"><div class="flex"><strong>${esc(emp(p.id)?.name||'Employee')}</strong><strong>${money(p.hours*p.wage)}</strong></div><div class="detail">${p.hours} hrs × ${money(p.wage)} hourly rate</div><div class="detail">Payroll: ${p.hours} hrs × ${money(p.wage)} = ${money(p.hours*p.wage)}</div></div>`).join('')}<div class="flex" style="margin-top:15px"><span>Booking fee</span><strong>${money(s.people.length*5)}</strong></div><div class="sep"></div><div class="flex"><span>Invoice total</span><strong class="totals">${money(shiftTotal(s))}</strong></div><div class="flex" style="margin-top:12px"><span>Employee payroll total</span><strong>${money(shiftPay(s))}</strong></div><div class="sep"></div><p class="small muted">Invoice #${s.invoiceNo||'Not assigned'}</p><div class="flex" style="flex-wrap:wrap">${btn('Assign invoice number','numberInvoice()')}${btn('Share Invoice','printInvoice()','')}${btn('Save invoice','saveCurrentSingleInvoice()','')}</div>`}if(m.type==='savedInvoice'){let x=db.savedInvoices.find(a=>a.id===m.id);if(!x){modal=null;render();return}title='Invoice #'+x.invoiceNo;back="go('billing')";content=`<p class="hint">Edit this saved invoice without changing employee shifts or payroll. Changes are saved only when you tap Save changes.</p><div class="field"><label>Client name</label><input id="invClientName" value="${esc(x.clientName)}"></div><div class="field"><label>Billing address</label><textarea id="invAddress" rows="2">${esc(x.address||'')}</textarea></div><div class="field"><label>Invoice date</label><input id="invInvoiceDate" type="date" value="${x.invoiceDate||lastWorkDate(db.shifts.filter(s=>x.shiftIds.includes(s.id)))}"></div><div class="field"><label>Invoice status</label><select id="invStatus">${['Unpaid','Paid','Overdue'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Workdays included (edit selected dates)</label>${db.shifts.filter(s=>s.clientId===x.clientId).sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<label class="item" style="display:flex;gap:10px;align-items:center"><input type="checkbox" class="invDate" value="${s.id}" ${x.shiftIds.includes(s.id)?'checked':''} style="width:20px;height:20px"><span>${fmt(s.date)}</span></label>`).join('')||'<p class="hint">Original shifts are no longer available. Saved invoice details remain editable.</p>'}${btn('Recalculate from selected dates','rebuildSavedInvoice()')}</div><h3>Employee work dates</h3>${invoiceWorkdayPreview(x.entries)}<p class="hint">Edit employee totals below without changing payroll.</p>${x.entries.map((p,i)=>`<div class="item" style="cursor:default"><strong>${esc(p.name)}</strong><div class="two"><div class="field"><label>Total hours</label><input class="invHours" data-i="${i}" type="number" min="0" step="0.25" value="${p.hours}"></div><div class="field"><label>Line amount ($)</label><input class="invAmount" data-i="${i}" type="number" min="0" step="0.01" value="${p.amount}"></div></div><div class="small muted">${esc(p.rateLabel||'Variable rate')}</div></div>`).join('')}<div class="field"><label>Booking fees ($)</label><input id="invFee" type="number" min="0" step="0.01" value="${x.fee}"></div><label class="item" style="display:flex;align-items:center;gap:12px"><input id="invGST" type="checkbox" style="width:22px;height:22px" ${(x.gstEnabled===undefined?true:x.gstEnabled)?'checked':''}><span>Charge GST (5%) on this invoice</span></label><div class="field"><label>Notes</label><textarea id="invNotes" rows="2">${esc(x.notes||'')}</textarea></div><div class="flex" style="flex-wrap:wrap">${btn('Save changes','saveEditedInvoice()','')}${btn('Share Invoice','printSavedInvoice()')}${btn('Delete invoice','deleteSavedInvoice()','danger')}</div>`;}o.innerHTML=`<div class="modalwrap" role="dialog" aria-modal="true"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" onclick="${back}" aria-label="Back">✕</button></div>${content}</div></div>`}function invoiceEntriesForShifts(shifts){let people=new Map();for(let s of shifts)for(let p of s.people){let e=people.get(p.id)||{id:p.id,name:emp(p.id)?.name||'Employee',hours:0,amount:0,rates:[],workdays:[]};e.hours+=+p.hours||0;e.amount+=(+p.hours||0)*(+p.wage||0);e.rates.push(+p.wage||0);e.workdays.push({date:s.date,hours:+p.hours||0,rate:+p.wage||0,amount:(+p.hours||0)*(+p.wage||0)});people.set(p.id,e)}return [...people.values()].map(p=>({...p,workdays:p.workdays.sort((a,b)=>a.date.localeCompare(b.date)),rate:Math.max(0,...p.rates),rateLabel:p.rates.every(r=>r===p.rates[0])?money(p.rates[0]):'Variable rates'})).sort((a,b)=>b.rate-a.rate||b.amount-a.amount||a.name.localeCompare(b.name))}
function savedInvoiceSubtotal(x){return x.entries.reduce((n,p)=>n+(+p.amount||0),+x.fee||0)}function savedInvoiceTotal(x){let subtotal=savedInvoiceSubtotal(x);return subtotal+(x.gstEnabled===undefined?Math.round(subtotal*0.05*100)/100:x.gstEnabled?Math.round(subtotal*0.05*100)/100:0)}
function saveInvoiceFromShifts(shifts,cid,existingNo){if(!shifts.length)return alert('Select at least one workday');let c=client(cid),ids=shifts.map(s=>s.id).sort();let x={id:id(),invoiceNo:existingNo&&!db.savedInvoices.some(z=>z.invoiceNo===existingNo)?existingNo:db.invoiceSeq++,clientId:cid,clientName:c?.name||'Client',address:c?.address||'',shiftIds:ids,entries:invoiceEntriesForShifts(shifts),fee:shifts.reduce((n,s)=>n+s.people.length*5,0),notes:'',status:'Unpaid',gstEnabled:db.gstEnabled,invoiceDate:lastWorkDate(shifts),created:new Date().toISOString()};db.savedInvoices.push(x);save();modal={type:'savedInvoice',id:x.id};render();toast('Invoice saved')}
function saveCurrentCombinedInvoice(){let d=combinedData(),date=document.getElementById('combinedDate')?.value;saveInvoiceFromShifts(d.shifts,billClient,currentCombinedNumber());let x=db.savedInvoices.find(a=>a.id===modal?.id);if(x&&date){x.invoiceDate=date;save();render()}}
function saveCurrentSingleInvoice(){let s=shift(shiftId);if(s){let date=document.getElementById('singleDate')?.value;saveInvoiceFromShifts([s],s.clientId,s.invoiceNo);let x=db.savedInvoices.find(a=>a.id===modal?.id);if(x&&date){x.invoiceDate=date;save();render()}}}
function openSavedInvoice(i){modal={type:'savedInvoice',id:i};render()}
function collectSavedInvoiceFields(x){x.clientName=$('invClientName').value.trim()||x.clientName;x.address=$('invAddress').value;x.status=$('invStatus').value;x.gstEnabled=$('invGST').checked;x.notes=$('invNotes').value;x.invoiceDate=$('invInvoiceDate').value||x.invoiceDate;x.fee=Math.max(0,+$('invFee').value||0);document.querySelectorAll('.invHours').forEach(el=>{x.entries[+el.dataset.i].hours=Math.max(0,+el.value||0)});document.querySelectorAll('.invAmount').forEach(el=>{x.entries[+el.dataset.i].amount=Math.max(0,+el.value||0)})}
function saveEditedInvoice(){let x=db.savedInvoices.find(a=>a.id===modal?.id);if(!x)return;collectSavedInvoiceFields(x);x.updated=new Date().toISOString();save();render();toast('Invoice changes saved')}
function rebuildSavedInvoice(){let x=db.savedInvoices.find(a=>a.id===modal?.id);if(!x)return;let ids=[...document.querySelectorAll('.invDate:checked')].map(el=>el.value),shifts=db.shifts.filter(s=>ids.includes(s.id)&&s.clientId===x.clientId);if(!shifts.length)return alert('Select at least one workday');if(!confirm('Recalculate employee totals and booking fees from these shifts? Existing invoice line edits will be replaced.'))return;collectSavedInvoiceFields(x);x.shiftIds=shifts.map(s=>s.id);x.invoiceDate=lastWorkDate(shifts);x.entries=invoiceEntriesForShifts(shifts);x.fee=shifts.reduce((n,s)=>n+s.people.length*5,0);x.updated=new Date().toISOString();save();render();toast('Invoice recalculated')}
function printSavedInvoice(){let x=db.savedInvoices.find(a=>a.id===modal?.id);if(!x)return;saveEditedInvoice();let entries=x.entries.map(p=>({...p,rateLabel:p.rateLabel||'Variable rates'})).sort((a,b)=>(b.rate||0)-(a.rate||0)||b.amount-a.amount||a.name.localeCompare(b.name));showInvoicePrint(invoiceDocument({name:x.clientName,address:x.address},x.invoiceNo,entries,x.fee,savedInvoiceSubtotal(x),x.shiftIds.length,x.notes,x.invoiceDate||lastWorkDate(db.shifts.filter(s=>x.shiftIds.includes(s.id))),x.gstEnabled===undefined?true:x.gstEnabled))}
function deleteSavedInvoice(){let x=db.savedInvoices.find(a=>a.id===modal?.id);if(!x||!confirm('Delete saved invoice #'+x.invoiceNo+'? This cannot be undone.'))return;db.savedInvoices=db.savedInvoices.filter(a=>a.id!==x.id);save();go('billing');toast('Saved invoice deleted')}

render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
